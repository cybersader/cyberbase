name: Decision Ledger Record
run-name: Decision Ledger Record / source run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [Decision Ledger Capture]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: decision-ledger-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  record:
    name: reconstruct-and-record
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.name, 'Decision Ledger Capture / PR #') &&
      github.event.workflow_run.name == github.event.workflow_run.display_title &&
      github.event.workflow_run.path == '.github/workflows/decision-ledger-capture.yml' &&
      github.event.workflow_run.repository.id == github.event.repository.id &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.id > 0 &&
      github.event.workflow_run.run_attempt > 0 &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the latest trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          path: vault

      - name: Check out reviewed Cyberbaser tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cybersader/cyberbaser
          # NON-RUNNABLE PLACEHOLDER: replace only with the reviewed implementation commit.
          ref: '7410256e3701245283f05dab8543fcf26563c9d0'
          fetch-depth: 1
          path: cyberbaser
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.11'

      - name: Install locked ledger dependency closure
        run: |
          bun install --cwd cyberbaser/packages/ofm --frozen-lockfile
          bun install --cwd cyberbaser/packages/trust --frozen-lockfile
          bun install --cwd cyberbaser/packages/ledger --frozen-lockfile

      - name: Reconstruct authority and publish the ledger entry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VAULT_CHECKOUT: ${{ github.workspace }}/vault
        run: |
          set -euo pipefail
          bun cyberbaser/packages/ledger/bin/cb-decision-ledger-github.js record \
            --event "$GITHUB_EVENT_PATH" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --checkout "$VAULT_CHECKOUT" \
            --repository-id "$EXPECTED_REPOSITORY_ID" \
            --repository "$EXPECTED_REPOSITORY" \
            --remote origin \
            --remote-url "$EXPECTED_REMOTE_URL" \
            --branch "$DEFAULT_BRANCH"
